[package]
name = "archiv-des-vergessens"
version = "1.0.26"
description = "Archiv des Vergessens – Ein episches Idle-RPG über Erinnerung, Vergessen und die Macht der Mneme."
authors = ["Grimoire Interactive"]
edition = "2021"

[lib]
name = "archiv_des_vergessens_lib"
path = "src/lib.rs"

[[bin]]
name = "archiv-des-vergessens"
path = "src/main.rs"

[[test]]
name = "auth_tests"
path = "tests/integration/auth_tests.rs"

[[test]]
name = "db_tests"
path = "tests/integration/db_tests.rs"

[[test]]
name = "command_tests"
path = "tests/integration/command_tests.rs"

[[test]]
name = "app_tests"
path = "tests/e2e/app_tests.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["test"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.3.1"
tokio = { version = "1.38", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
pbkdf2 = { version = "0.12", features = ["simple"] }
sha2 = "0.10"
thiserror = "1.0"
rand = "0.8"
tempfile = "3.10"
toml = "0.8"
aes-gcm = "0.10"
argon2 = "0.5"
jsonwebtoken = "10.3"
base64 = "0.22"

[dev-dependencies]
mockall = "0.13"
rstest = "0.21"
