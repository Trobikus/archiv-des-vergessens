[package]
name = "archiv-launcher"
version = "1.0.0"
description = "Archiv des Vergessens Launcher"
authors = ["Grimoire Interactive"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
zip = "2.2"
dirs = "5.0"
ed25519-dalek = "2.1"
hex = "0.4.3"
