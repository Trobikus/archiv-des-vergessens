name: Tauri Release Build (Game & Standalone Launcher)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write  # Zum Erstellen von GitHub Releases

jobs:
  release:
    name: Build & Release Portable Game & Launcher
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            launcher/src-tauri

      - name: Install Dependencies
        run: npm install

      - name: Run Tests
        run: npm test

      - name: Run TypeCheck
        run: npm run typecheck

      - name: Build Web Frontend Assets
        run: npm run build

      - name: Build Portable Game Executable
        run: npm run game:build

      - name: Create Portable Game ZIP Archive
        run: |
          Compress-Archive -Path src-tauri/target/release/ArchivDesVergessens.exe -DestinationPath src-tauri/target/release/archiv-des-vergessens.zip -Force

      - name: Build Standalone Launcher Executable
        run: npm run launcher:build

      - name: Prepare Launcher Executable
        run: |
          Copy-Item launcher/src-tauri/target/release/archiv-launcher.exe -Destination launcher/src-tauri/target/release/ArchivDesVergessens-Launcher.exe -Force

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/archiv-des-vergessens.zip
            launcher/src-tauri/target/release/ArchivDesVergessens-Launcher.exe
          name: Archiv des Vergessens ${{ github.ref_name }}
          body: |
            ## Neues Release: Archiv des Vergessens (${{ github.ref_name }})

            ### 🚀 Installation & Start
            1. Lade den **`ArchivDesVergessens-Launcher.exe`** herunter.
            2. Starte die Launcher-Datei – sie lädt automatisch das Portable-Spielpaket herunter, entpackt es und startet das Spiel!

            *(Alternativ kannst du das Zip-Archiv `archiv-des-vergessens.zip` direkt herunterladen und entpacken).*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
